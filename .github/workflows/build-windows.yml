name: Build Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ desktop-windows ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build pull request
        if: github.event_name == 'pull_request'
        run: npm run dist:win
      - name: Build and publish desktop release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/desktop-windows'
        run: npm run dist:win:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: NAI-Studio-Windows-Installer
          path: dist/NAI-Studio-Setup-*.exe
          if-no-files-found: error
